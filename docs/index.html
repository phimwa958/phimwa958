<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phimwaree's Portfolio | Selection</title>
    <link rel="stylesheet" href="landing-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Welcome to Phimwa's personal portfolio. Choose your preferred language to explore my skills, projects, and professional journey.">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="hero">
            <h1 class="fade-in">Welcome to my Portfolio</h1>
            <p class="fade-in delay-1">ยินดีต้อนรับเข้าสู่พอร์ตโฟลิโอของฉัน</p>
        </header>

        <section class="selection-grid fade-in delay-2">
            <a href="eng/index.html" class="selection-card glass">
                <div class="card-content">
                    <span class="lang-code">EN</span>
                    <h2>English</h2>
                    <p>Enter my portfolio English Version</p>
                </div>
                <div class="arrow">→</div>
            </a>

            <a href="th/index.html" class="selection-card glass">
                <div class="card-content">
                    <span class="lang-code">TH</span>
                    <h2>ภาษาไทย</h2>
                    <p>เข้าชมเวอร์ชันภาษาไทย</p>
                </div>
                <div class="arrow">→</div>
            </a>
        </section>

        <footer class="fade-in delay-3">
            <p>&copy; <span id="year">2026</span> phimwa958. All rights reserved.</p>
        </footer>
    </main>

    <script>
        // Set dynamic copyright year
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Simple entry animation trigger
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Landing page loaded');
        });
    </script>
</body>
</html>
